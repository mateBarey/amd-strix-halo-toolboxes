name: Gufo Nix toolbox

on:
  pull_request:
    paths:
      - '.github/workflows/gufo-nix.yml'
      - 'toolboxes/Dockerfile.gufo-nix'
      - 'toolboxes/gufo-nix/**'
      - 'scripts/gufo-nix/**'
      - 'tests/gufo_nix/**'
  push:
    paths:
      - '.github/workflows/gufo-nix.yml'
      - 'toolboxes/Dockerfile.gufo-nix'
      - 'toolboxes/gufo-nix/**'
      - 'scripts/gufo-nix/**'
      - 'tests/gufo_nix/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the smoke-tested image to this fork's GHCR package
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: gufo-nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: CPU and script checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned GGUF utilities
        run: python3 -m pip install 'gguf==0.19.0'

      - name: Check shell and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for path in scripts/gufo-nix/*.sh toolboxes/gufo-nix/bin/*; do
            [[ -f "$path" ]] || continue
            IFS= read -r first_line < "$path" || true
            case "$path:$first_line" in
              *.sh:*|*:'#!/bin/bash'*|*:'#!/usr/bin/bash'*|*:'#!/usr/bin/env bash'*|*:'#!/bin/sh'*|*:'#!/usr/bin/env sh'*)
                bash -n "$path"
                ;;
            esac
          done
          python3 -m compileall -q scripts/gufo-nix toolboxes/gufo-nix tests/gufo_nix

      - name: Run CPU tests
        run: python3 -m unittest discover -s tests/gufo_nix -v

      - name: Check Fedora 44 Nix bootstrap with Podman OCI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          # Exercise the actual Fedora/Nix bootstrap from the production recipe.
          # This catches removed CA paths and OCI shell behavior without compiling ROCm.
          python3 - "$RUNNER_TEMP/Dockerfile.gufo-nix-bootstrap" <<'PY'
          from pathlib import Path
          import sys
          recipe = Path('toolboxes/Dockerfile.gufo-nix').read_text()
          boundary = '\nCOPY toolboxes/gufo-nix/flake.nix'
          assert recipe.count(boundary) == 1
          bootstrap = recipe.split(boundary)[0]
          bootstrap += '\nRUN /bin/bash -euo pipefail -c \'test -s "$NIX_SSL_CERT_FILE"; /opt/nix/bin/nix store ping --store https://cache.nixos.org\'\n'
          Path(sys.argv[1]).write_text(bootstrap)
          PY
          # Rootful Podman here is confined to the disposable CI runner; user setup is rootless.
          sudo podman build --format oci \
            --tag localhost/gufo-nix-bootstrap:ci \
            --file "$RUNNER_TEMP/Dockerfile.gufo-nix-bootstrap" .

  image:
    name: Build and smoke-test image without GPU
    needs: check
    # PRs never build or publish images. Feature-branch pushes run CPU checks only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    # Nix/ROCm closure builds can exceed a hosted runner's disk or RAM budget.
    # This is a bounded attempt; the documented local build uses the same recipe.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE: gufo-nix:ci
    steps:
      - uses: actions/checkout@v7

      - name: Resolve pinned source and fork image names
        id: image
        shell: bash
        run: |
          set -euo pipefail
          revision=$(tr -d '\r\n' < toolboxes/gufo-nix/gufo-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'gufo-revision must contain one exact 40-character commit' >&2
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'channel=%s:gufo-nix\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'immutable=%s:gufo-nix-%s-%s-%s\n' \
            "$image" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Show available hosted build resources
        run: |
          df -h /
          free -h

      - name: Build coherent Nix image
        shell: bash
        env:
          GUFO_REVISION: ${{ steps.image.outputs.revision }}
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --build-arg NIX_BUILD_CORES=2 \
            --build-arg NIX_MAX_JOBS=1 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "io.gufo.revision=${GUFO_REVISION}" \
            --tag "$LOCAL_IMAGE" \
            --file toolboxes/Dockerfile.gufo-nix .

      - name: Run CPU-only image smoke checks
        env:
          CONTAINER_ENGINE: docker
        run: scripts/gufo-nix/smoke-image.sh "$LOCAL_IMAGE"

      - name: Log in to this fork's container registry
        if: >-
          (github.event_name == 'push' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: >-
          (github.event_name == 'push' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          IMMUTABLE_IMAGE: ${{ steps.image.outputs.immutable }}
          CHANNEL_IMAGE: ${{ steps.image.outputs.channel }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "$IMMUTABLE_IMAGE"
          docker push "$IMMUTABLE_IMAGE"
          docker tag "$LOCAL_IMAGE" "$CHANNEL_IMAGE"
          docker push "$CHANNEL_IMAGE"
          printf 'Published `%s` and `%s`.\n' \
            "$IMMUTABLE_IMAGE" "$CHANNEL_IMAGE" >> "$GITHUB_STEP_SUMMARY"
